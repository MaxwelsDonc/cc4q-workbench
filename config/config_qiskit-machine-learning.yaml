# 清洗模式：可选值为 current_only / full / none
clean_mode: current_only

# 项目信息
project: qiskit-machine-learning
version: 0.9.1
language: python

# 输入输出路径（建议使用解析后自动拼接）
input_dir: data/input/qiskit-machine-learning
output_dir: data/output/qiskit-machine-learning

# 包含的源码目录（相对 input_dir）
include_dirs:
  - qiskit_machine_learning


pipeline:
  analyze: true        # 是否统计注释类型分布
  segment: true        # 是否进行注释语义分割
