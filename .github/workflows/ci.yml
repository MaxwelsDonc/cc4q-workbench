name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean install (pipeline only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lean install per README + run pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install libcst==1.8.2 pyyaml loguru tqdm docutils==0.21.2 sphinx==8.2.3 spacy==3.8.7 click
          python -m spacy download en_core_web_sm
          python scripts/02_extract_code_comment_pairs.py config/examples.yaml
          python scripts/03_segment_comments.py config/examples.yaml

  quickstart:
    name: Quick start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runners default to cp1252 consoles; force UTF-8 everywhere so
    # non-ASCII log/print output (emojis, arrows) cannot crash the run.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            demo/requirements-demo.txt

      - name: Free disk space (Linux runners)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r demo/requirements-demo.txt
          python -m spacy download en_core_web_sm

      - name: Pipeline quick start (examples)
        run: |
          python scripts/02_extract_code_comment_pairs.py config/examples.yaml
          python scripts/03_segment_comments.py config/examples.yaml

      - name: Assert pipeline outputs exist
        shell: bash
        run: |
          ls -lh examples/output/
          test -s examples/output/comment_pairs_current_only.json
          test -s examples/output/segmented/comment_pairs_current_only_segmented.json

      - name: Demo smoke tests (data mode, no checkpoints)
        run: python demo/smoke_test.py

      - name: Install the cc4q package (console script for cc4q serve)
        run: python -m pip install -e .

      - name: Web workbench boot check (cc4q serve + curl)
        shell: bash
        run: |
          # Fresh env: no checkpoints, no user models. The server must boot
          # on the precomputed demo data alone.
          export CC4Q_SKIP_MODEL_DOWNLOAD=1
          cc4q serve --host 127.0.0.1 --port 8502 > cc4q_serve.log 2>&1 &
          APP_PID=$!
          ok_index="" ok_api=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8502/ || true)
            if [ "$code" = "200" ]; then ok_index="$code"; break; fi
            sleep 2
          done
          if [ "$ok_index" = "200" ]; then
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8502/api/overview || true)
              if [ "$code" = "200" ]; then ok_api="$code"; break; fi
              sleep 2
            done
          fi
          kill $APP_PID 2>/dev/null || true
          cat cc4q_serve.log
          if [ "$ok_index" != "200" ] || [ "$ok_api" != "200" ]; then
            echo "cc4q serve boot check failed (index='$ok_index' api='$ok_api')"
            exit 1
          fi
          echo "cc4q serve boot check OK (index + /api/overview HTTP 200)"

  docker:
    name: Docker images (CPU run + GPU build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU image
        run: docker build -t cc4q-workbench:test-cpu .

      - name: Run CPU image and check HTTP 200 (no checkpoints)
        run: |
          docker run -d --name cc4q -p 8501:8501 \
            -e CC4Q_SKIP_MODEL_DOWNLOAD=1 cc4q-workbench:test-cpu
          ok=""
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501/ || true)
            if [ "$code" = "200" ]; then ok="$code"; break; fi
            sleep 3
          done
          docker logs cc4q || true
          docker stop cc4q || true
          if [ "$ok" != "200" ]; then
            echo "Container HTTP check failed (last code: '$code')"
            exit 1
          fi
          echo "Container HTTP check OK (HTTP 200)"

      - name: Pipeline CLI inside the CPU container
        run: |
          docker run --rm --entrypoint bash cc4q-workbench:test-cpu -c \
            "python scripts/02_extract_code_comment_pairs.py config/examples.yaml && python scripts/03_segment_comments.py config/examples.yaml"

      - name: Build GPU image (build-only, no GPU runtime needed)
        run: docker build --build-arg TORCH_CHANNEL=cu126 -t cc4q-workbench:test-gpu .

  pytest:
    name: pytest suite (${{ matrix.os }})
    # Deliberately NO PYTHONUTF8 here: the suite must pass on a default
    # Windows (GBK) console too, so every file open in our code is forced
    # to declare encoding="utf-8".
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            demo/requirements-demo.txt

      - name: Free disk space (Linux runners)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r demo/requirements-demo.txt
          python -m spacy download en_core_web_sm

      - name: Run pytest (model tests self-skip without checkpoints)
        run: python -m pytest -v

  packaging:
    name: Packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (no deps)
        run: python -m pip install -e . --no-deps

      - name: Install the CLI's own deps (job uses --no-deps)
        run: python -m pip install -q typer click

      - name: Import cc4q (light) and pipeline.files
        shell: bash
        run: |
          python -c "import cc4q; print(cc4q.__version__)"
          python -c "from cc4q.pipeline.files import get_files_from_dir; print('pipeline OK')"
          cc4q --help >/dev/null && echo "console script OK"
          # fresh checkout has no checkpoints: --check must fail loudly
          if cc4q download-models --check; then
            echo "unexpected: checkpoints present in fresh checkout"; exit 1
          else
            echo "download-models --check correctly reports missing"
          fi
          for c in download-models build predict sample annotate train evaluate demo serve; do
            cc4q "$c" --help >/dev/null || exit 1
          done
          echo "all subcommand --help OK"

  docs:
    name: Sphinx docs (-W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs + package deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements-docs.txt
          python -m pip install -e .
          python -m pip install -q plotly pandas

      - name: Build docs (warnings as errors)
        run: sphinx-build -b html docs docs/_build -W

  assets:
    name: Checkpoint release assets reachable + SHA256-verified
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash-verify cc4q-workbench v0.2.0 assets
        run: |
          base="https://github.com/MaxwelsDonc/cc4q-workbench/releases/download/v0.2.0"
          cat > expected.txt <<'EOF'
          3a519c5173f323f735434065d248b50bc58a8a36d0ce6f59f6f21196b10f7bdd  quantum_related.tar.gz
          de17c00707c23adcb8818844e84a1acb0b03486cb655999e8513989ab3c81b32  quantum_category.tar.gz
          6799ef37acf0235c6ba426d526127acfd9477c30b71c6f106a624692a3171294  bert-base-uncased.tar.gz
          EOF
          sed -i 's/^ *//' expected.txt
          failed=0
          for asset in quantum_related.tar.gz quantum_category.tar.gz bert-base-uncased.tar.gz; do
            code=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 60 "$base/$asset")
            echo "$asset -> HTTP $code"
            if [ "$code" != "200" ]; then failed=1; continue; fi
            curl -sL --retry 3 --max-time 600 -o "$asset" "$base/$asset"
          done
          sha256sum -c expected.txt || failed=1
          exit $failed
